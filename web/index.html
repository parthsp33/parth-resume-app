  <script>
    // The Flutter engine rewrites the viewport meta tag at boot and adds
    // user-scalable=no, which blocks pinch zoom. Put a zoomable viewport back
    // once the engine has finished touching it.
    (function () {
      var restore = function () {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var wanted = 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes';
        if (meta.getAttribute('content') !== wanted) {
          meta.setAttribute('content', wanted);
        }
      };
      var head = document.querySelector('head');
      if (window.MutationObserver && head) {
        new MutationObserver(restore).observe(head, {
          subtree: true,
          attributes: true,
          attributeFilter: ['content'],
        });
      }
      window.addEventListener('load', restore);
    })();
  </script>
